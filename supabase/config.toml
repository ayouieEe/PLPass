project_id = "ouwyhaozkqvhjalqdsvc"

[api]
enabled = true
port = 65431
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17
port = 65432

[studio]
enabled = true
port = 65433

[inbucket]
enabled = true
port = 65434

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset-password", "http://localhost:5173/accept-invitation"]

[functions.analyze-feedback]
enabled = true
verify_jwt = false
import_map = "./functions/analyze-feedback/deno.json"
entrypoint = "./functions/analyze-feedback/index.ts"

[functions.manage-users]
enabled = true
# This function validates the caller and action in its handler.  Keep this
# explicit so staging and production do not silently deploy with different
# gateway settings.
verify_jwt = false
entrypoint = "./functions/manage-users/index.ts"

[functions.send-event-emails]
enabled = true
# The handler verifies both dedicated worker headers before dispatching. The
# service-role key is never sent by the database dispatcher.
verify_jwt = false
